<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQ297 Lookup Test</title><style>body{font:17px -apple-system,system-ui,sans-serif;max-width:650px;margin:32px auto;padding:0 18px;line-height:1.5}button{font:inherit;padding:12px 18px;border:0;border-radius:9px;background:#1558aa;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:15px;border-radius:9px}a{color:#1558aa}</style></head><body><h1>SQ297 registration lookup test</h1><p>This checks whether your browser can read the public Flexport Atlas page. It does not change your fuel sheet.</p><button id="test">Test lookup</button><pre id="result" aria-live="polite">Ready.</pre><p><a href="https://atlas.flexport.com/flight/iata:sq297/icao:sia297" target="_blank" rel="noopener">Open SQ297 on Flexport Atlas</a></p><script>document.getElementById('test').addEventListener('click',async()=>{const out=document.getElementById('result');out.textContent='Checking…';try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);let response;try{response=await fetch('https://atlas.flexport.com/flight/iata:sq297/icao:sia297',{mode:'cors',cache:'no-store',signal:controller.signal});}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const html=await response.text();const match=html.match(/registration\s+(9V-[A-Z0-9]+)/i)||html.match(/Registration[\s\S]{0,200}?(9V-[A-Z0-9]+)/i);out.textContent=match?'Readable page. Candidate registration: '+match[1]+'\nCheck the flight date manually before use.':'Page readable, but no registration found in returned HTML. A different data source or parser may be needed.';}catch(e){out.textContent='Direct browser lookup did not work ('+e.name+'). This may be due to cross-origin restrictions, connectivity, or the site blocking requests.\n\nThe fuel sheet can still work offline with manual registration entry.';}});</script></body></html>
